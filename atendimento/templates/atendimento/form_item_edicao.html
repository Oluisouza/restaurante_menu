{% extends 'base.html' %}

{% block titulo %}Editar item | {{ comanda.codigo }}{% endblock %}

{% block conteudo %}
<a href="{% url 'atendimento:detalhe_comanda' comanda.pk %}" class="voltar">Voltar à comanda</a>
<div class="topo">
    <div>
        <h2>Editar item</h2>
        <p class="subtitulo"><span class="codigo">{{ comanda.codigo }}</span>, {{ comanda.responsavel|default:"sem nome" }}</p>
    </div>
</div>

<div class="form-box">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acoes">
            <button type="submit" class="botao">Salvar alterações</button>
            <a href="{% url 'atendimento:detalhe_comanda' comanda.pk %}" class="botao claro">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
