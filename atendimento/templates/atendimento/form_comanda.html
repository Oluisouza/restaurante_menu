{% extends 'base.html' %}

{% block titulo %}Nova comanda | Comanda Digital{% endblock %}

{% block conteudo %}
<a href="{% url 'atendimento:salao' %}" class="voltar">Voltar ao salão</a>
<div class="topo">
    <div>
        <h2>Nova comanda</h2>
        <p class="subtitulo">{{ rotulo_tipo }}</p>
    </div>
</div>

<div class="form-box">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acoes">
            <button type="submit" class="botao">Abrir e lançar pedido</button>
            <a href="{% url 'atendimento:salao' %}" class="botao claro">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
