{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Comanda Digital{% endblock%}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f4f1ec;
            color: #2b2724;
            line-height: 1.5;
        }

        header {
            background: #3d2b1f;
            color: #f4f1ec;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        header h1 {
            font-size: 1.2rem;
            letter-spacing: .5px;
        }

        nav {
            display: flex;
            gap: 1.25rem;
        }

        nav a {
            color: #e8dcc8;
            text-decoration: none;
            font-size: .95rem;
        }

        nav a:hover {
            color: #fff;
            text-decoration: underline;
        }

        main {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        h3 {
            margin: 1.5rem 0 .75rem;
            font-size: 1.1rem;
            color: #6b5544;
        }

        .grade {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .cartao {
            background: #fff;
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid #e0d9cf;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .cartao:hover {
            border-color: #b08968;
        }

        .cartao.ocupada {
            border-left: 4px solid #c1440e;
        }

        .cartao.livre {
            border-left: 4px solid #5c8a3a;
        }

        .etiqueta {
            display: inline-block;
            padding: .15rem .5rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .ABERTA,
        .PENDENTE {
            background: #fde8c8;
            color: #8a5a00;
        }

        .FECHADA,
        .ENTREGUE {
            background: #d9ead0;
            color: #3c6122;
        }

        .CANCELADA,
        .CANCELADO {
            background: #f2d5d0;
            color: #8a2c14;
        }

        .EM_PREPARO {
            background: #d6e4f5;
            color: #1f4b7a;
        }

        .PRONTO {
            background: #e0d5f0;
            color: #4b2b7a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            padding: .6rem .75rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #efe9e1;
            font-size: .85rem;
            text-transform: uppercase;
        }

        .direita {
            text-align: right;
        }

        .vazio {
            color: #8a7f75;
            font-style: italic;
            padding: 1rem 0;
        }

        .totais {
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .totais div {
            display: flex;
            justify-content: space-between;
            padding: .3rem 0;
        }

        .totais .final {
            font-size: 1.25rem;
            font-weight: 700;
            border-top: 2px solid #3d2b1f;
            margin-top: .5rem;
            padding-top: .5rem;
        }

        form.filtros {
            margin-bottom: 1rem;
            display: flex;
            gap: .5rem;
        }

        input,
        select,
        button {
            padding: .5rem;
            font: inherit;
            border: 1px solid #cfc6ba;
            border-radius: 4px;
        }

        button {
            background: #3d2b1f;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .avisos {
            list-style: none;
            margin-bottom: 1rem;
        }

        .avisos li {
            padding: .7rem 1rem;
            border-radius: 6px;
            margin-bottom: .5rem;
        }

        .avisos .success {
            background: #d9ead0;
            color: #2c4a19;
        }

        .avisos .error {
            background: #f6d5cf;
            color: #7a2413;
        }

        .avisos .warning {
            background: #fdeecb;
            color: #7a5500;
        }

        .avisos .info {
            background: #d9e6f5;
            color: #1f4b7a;
        }

        .botao {
            display: inline-block;
            background: #3d2b1f;
            color: #fff;
            padding: .55rem 1rem;
            border-radius: 5px;
            text-decoration: none;
            font-size: .9rem;
        }

        .botao:hover {
            background: #5a3f2e;
        }

        .botao.claro {
            background: #b08968;
        }

        .acoes {
            display: flex;
            gap: .75rem;
            margin: 1rem 0;
            flex-wrap: wrap;
        }

        .form-box {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            max-width: 560px;
        }

        .form-box p {
            margin-bottom: 1rem;
        }

        .form-box label {
            display: block;
            font-weight: 600;
            margin-bottom: .25rem;
            font-size: .9rem;
        }

        .form-box input,
        .form-box select {
            width: 100%;
        }

        .form-box input[type="checkbox"] {
            width: auto;
        }

        .form-box .helptext {
            display: block;
            font-size: .8rem;
            color: #8a7f75;
            margin-top: .2rem;
        }

        .form-box ul.errorlist {
            list-style: none;
            color: #a52c14;
            font-size: .85rem;
            margin-bottom: .3rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>☕ Comanda Digital</h1>
        <nav>
            <a href="{% url 'atendimento:salao' %}">Salão</a>
            <a href="{% url 'atendimento:lista_comandas' %}">Comandas</a>
            <a href="{% url 'atendimento:cozinha' %}">Cozinha</a>
            <a href="{% url 'cardapio:lista_cardapio' %}">Cardápio</a>
            <a href="{% url 'cardapio:lista_pratos' %}">Gerenciar</a>
            <a href="/admin/">Admin</a>
        </nav>
    </header>

    <main>
        {% if messages %}
        <ul class="avisos">
            {% for mensagem in messages %}
            <li class="{{ mensagem.tags }}">{{ mensagem }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        {% block conteudo %}{% endblock %}
    </main>
</body>

</html>
