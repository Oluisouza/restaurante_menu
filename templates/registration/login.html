{% extends 'base.html' %}

{% block titulo %}Entrar | Comanda Digital{% endblock %}

{% block conteudo %}
<div class="entrada">
    <div class="form-box">
        <h2>Entrar</h2>
        {% if form.errors %}
        <p class="alerta perigo">Usuário ou senha incorretos. Confira e tente de novo.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <p>
                <label for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
            </p>
            <p>
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" autocomplete="current-password" required>
            </p>
            <input type="hidden" name="next" value="{{ next }}">
            <div class="acoes">
                <button type="submit" class="botao">Entrar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
