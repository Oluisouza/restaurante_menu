{% extends 'base.html' %}

{% block titulo %}{% if prato %}Editar{% else %}Novo{% endif %} item — Comanda Digital{% endblock %}

{% block conteudo %}
<h2>{% if prato %}Editar {{ prato.nome }}{% else %}Novo item do cardápio{% endif %}</h2>

<div class="form-box">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acoes">
            <button type="submit" class="botao">Salvar</button>
            <a href="{% url 'cardapio:lista_pratos' %}" class="botao claro">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
